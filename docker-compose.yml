version: '3.8'

services:
  auth-db-postgres:
    image: postgres:15-alpine
    container_name: auth-db-postgres
    environment:
      POSTGRES_USER: auth_admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: authdb
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data

volumes:
  auth_postgres_data: